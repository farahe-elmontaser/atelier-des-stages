# Configuration Nginx : la "porte d'entree" du serveur.
#  - sert le site React (fichiers construits par "npm run build")
#  - transmet les requetes /api au backend FastAPI (reverse proxy)
# Installe par install.sh dans /etc/nginx/sites-available/atelier
server {
    listen 80;
    server_name __DOMAINE__;

    # Le site React
    root /var/www/atelier;
    index index.html;

    # Taille maximale d'une requete (protection)
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API : transmise au backend qui ecoute seulement en local
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # un passage du pipeline avec le LLM peut etre long
    }

    # La doc automatique de l'API (http://domaine/docs)
    location ~ ^/(docs|openapi.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Mise en cache des fichiers du site (plus rapide)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
